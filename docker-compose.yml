version: '3.8'

services:

  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    networks:
      - glms-network

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.API/Dockerfile
    container_name: glms-backend-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server-db,1433;Database=GLMSDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - Jwt__Key=SuperSecretKey_GLMS_2026_MustBe32CharsLong!
      - Jwt__Issuer=GLMS.API
      - Jwt__Audience=GLMS.Web
    ports:
      - "8080:8080"
    depends_on:
      - sql-server-db
    networks:
      - glms-network

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS/Dockerfile
    container_name: glms-frontend-web
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8081
      - ConnectionStrings__DefaultConnection=Server=sql-server-db,1433;Database=GLMSDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
      - ApiSettings__BaseUrl=http://glms-backend-api:8080
    ports:
      - "8081:8081"
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge